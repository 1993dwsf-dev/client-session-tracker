name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Remove unused Freebuff dependencies and repair advisories
        run: |
          bun remove @vly-ai/integrations @zumer/snapdom axios @oslojs/crypto
          bun audit fix --latest || true
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Unit tests
        run: bun run test
      - name: Build
        run: bun run build
      - name: Security audit
        run: bun audit
        continue-on-error: true
      - name: Commit repaired dependency lockfile
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): remove obsolete Freebuff packages and refresh vulnerable dependencies"
            git push origin HEAD:main
          fi
